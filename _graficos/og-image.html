<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Imagen para compartir</title>
<!-- Fuente de og-image.png (1200×630). Se genera con: node _graficos/generar.js -->
<style>
@font-face{font-family:"Familjen Grotesk";font-weight:400 700;src:url(../fonts/familjen-grotesk-latin.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:300 900;src:url(../fonts/figtree-latin.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;color:#2b1d14;font-family:"Figtree",sans-serif;
  background:radial-gradient(800px 500px at 20% 0%,#fff6ec,transparent 70%),linear-gradient(165deg,#fdeadb,#f6d2b8)}
.mark{position:absolute;left:0;right:0;bottom:0;width:1200px;height:170px}
.left{position:absolute;left:72px;top:64px;bottom:62px;width:560px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-family:"Familjen Grotesk";font-weight:700;font-size:34px;letter-spacing:-.015em}
.brand img{width:60px;height:60px;border-radius:17px;box-shadow:0 6px 16px -6px rgba(150,70,30,.6)}
h1{font-family:"Familjen Grotesk";font-weight:700;font-size:62px;line-height:1.02;letter-spacing:-.03em;margin:46px 0 0;color:#8f3a17}
p{font-size:25px;line-height:1.35;color:#5a4334;margin:20px 0 0}
.url{align-self:flex-start;margin-top:auto;font-size:24px;font-weight:700;color:#fffaf3;background:#b8532a;border-radius:999px;padding:10px 22px;box-shadow:0 10px 20px -10px #b8532a}
.card{position:absolute;right:64px;top:70px;width:440px;height:396px;background:#fffaf3;border-radius:32px;color:#2b1d14;padding:30px 30px 24px;
  box-shadow:0 30px 60px -28px rgba(120,60,20,.55)}
.k{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7a6656}
.big{font-family:"Familjen Grotesk";font-weight:700;font-size:50px;letter-spacing:-.025em;color:#8f3a17;margin-top:6px;line-height:1}
.legend{display:flex;gap:18px;font-size:15px;color:#7a6656;margin-top:18px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:7px}
svg.chart{display:block;margin-top:8px}
</style>
</head>
<body>
<svg class="mark" viewBox="0 0 1200 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <circle cx="1120" cy="66" r="24" fill="#f4b061"/>
  <path d="M0 140 C 260 108 520 112 720 124 S 1000 100 1200 116 V170 H0Z" fill="#c3d8ae"/>
  <path d="M0 152 C 320 136 640 150 820 142 S 1080 134 1200 140 V170 H0Z" fill="#d9e6c6"/>
  <rect x="928" y="104" width="7" height="36" rx="3" fill="#8a5a3a"/>
  <circle cx="931" cy="94" r="21" fill="#5f9a6e"/><circle cx="947" cy="108" r="13" fill="#5f9a6e"/>
  <rect x="1050" y="64" width="12" height="24" rx="1" fill="#8f3a17"/>
  <rect x="990" y="84" width="92" height="56" rx="3" fill="#fffaf3"/>
  <path d="M978 88 1036 40 1094 88Z" fill="#c4572b"/>
  <rect x="1006" y="106" width="20" height="34" rx="3" fill="#8f3a17"/>
  <rect x="1042" y="100" width="24" height="19" rx="3" fill="#f6c27e"/>
</svg>
<div class="left">
  <div class="brand"><img src="../favicon.svg" alt="">Se paga sola</div>
  <h1>¿En cuánto tiempo la renta paga tu casa?</h1>
  <p>Simulador de crédito hipotecario para México, con banco, Apoyo Infonavit o Cofinavit.</p>
  <div class="url">sepagasola.com</div>
</div>
<div class="card">
  <div class="k">Se paga sola en</div>
  <div class="big" id="big">—</div>
  <div class="legend"><span><i style="background:#127f55"></i>Mensualidad</span><span><i style="background:#c47a1f"></i>Renta neta</span></div>
  <svg class="chart" width="380" height="230" viewBox="0 0 380 230">
    <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#127f55" stop-opacity=".22"/><stop offset="1" stop-color="#127f55" stop-opacity=".02"/></linearGradient></defs>
    <g stroke="#f2e6d6" stroke-width="1"><line x1="0" x2="380" y1="20" y2="20"/><line x1="0" x2="380" y1="70" y2="70"/><line x1="0" x2="380" y1="120" y2="120"/><line x1="0" x2="380" y1="170" y2="170"/></g>
    <line x1="0" x2="380" y1="220" y2="220" stroke="#efdfcc"/>
    <path id="area" fill="url(#a)"/>
    <path id="renta" fill="none" stroke="#c47a1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="pago" fill="none" stroke="#127f55" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="guia" stroke="#7a6656" stroke-opacity=".5"/>
    <circle id="halo" r="15" fill="#127f55" fill-opacity=".16"/>
    <circle id="punto" r="7" fill="#127f55" stroke="#fffaf3" stroke-width="3"/>
    <rect id="pill" width="120" height="30" rx="15" fill="#2b1d14"/>
    <text id="pill-t" text-anchor="middle" font-family="Figtree" font-weight="700" font-size="15" fill="#fff">Se paga sola</text>
  </svg>
</div>
<script>
/* La gráfica usa el cálculo real del sitio con los valores del ejemplo: lee el bloque <script id="logica"> de index.html,
   así el cruce cae justo donde la renta alcanza a la mensualidad y el texto coincide con lo que muestra la página. */
fetch('../index.html').then(r => r.text()).then(html => {
  const L = new Function(html.match(/<script id="logica">([\s\S]*?)<\/script>/)[1] + ';return SimLogica;')();
  const s = L.simulate(L.DEFAULTS), ms = s.months, n = ms.length, be = s.be;
  const W = 380, base = 220, top = 20, maxY = 20000;   // mismas líneas guía: $20 mil arriba, cada $5 mil
  const x = m => m / (n - 1) * W, y = v => base - Math.max(0, v) / maxY * (base - top);
  const path = k => ms.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[k]).toFixed(1)).join(' ');
  const set = (id, at) => Object.entries(at).forEach(([k, v]) => document.getElementById(id).setAttribute(k, v));
  set('pago', { d: path('pay') }); set('renta', { d: path('target') });
  set('area', { d: path('pay') + ` L${W} ${base} L0 ${base} Z` });
  const bx = x(be), by = y(ms[be].pay);
  set('guia', { x1: bx, x2: bx, y1: by + 8, y2: base }); set('halo', { cx: bx, cy: by }); set('punto', { cx: bx, cy: by });
  set('pill', { x: bx - 60, y: by - 52 }); set('pill-t', { x: bx, y: by - 32 });
  const a = Math.floor(be / 12), m = be % 12;
  document.getElementById('big').textContent = [a ? a + (a === 1 ? ' año' : ' años') : '', m ? m + (m === 1 ? ' mes' : ' meses') : ''].filter(Boolean).join(' y ');
  document.body.dataset.listo = '1';
});
</script>
</body>
</html>
